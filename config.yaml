# =============================================================================
# config.yaml — ÚNICO archivo que hay que tocar para procesar otra imagen/video
# =============================================================================
# Todo lo que depende de la
# grabación concreta (rutas, ROI, instante del frame) lo ponemos acá, y el código
# solo lee estos valores.
#
# YAML es un formato de texto "clave: valor". La indentación (con espacios,
# nunca tabs) define qué está adentro de qué. "null" significa "vacío/ninguno".
# =============================================================================

entrada:
  # --- Opción 1: partir de una imagen ya extraída (lo que usamos ahora) ------
  # Ruta RELATIVA a la raíz del repo. Si es null, se usa el video.
  # imagen_path: data/frames/frame_Sofi_1.png  --> lo pongo null pq quiero que se obtenga el frame del video automáticamente
  imagen_path: null
  # --- Opción 2: partir del video y extraer un frame automáticamente ---------
  # Solo se usa si imagen_path es null.
  video_path: data/videos/Video_Sofi_2.mp4
  # Instante (en segundos) del frame representativo dentro del video.
  frame_tiempo_s: 17.0

# -----------------------------------------------------------------------------
# Región de Interés (ROI) del ojo
# -----------------------------------------------------------------------------
# Se expresa en FRACCIONES del ancho y alto (valores entre 0 y 1), NO en
# píxeles. Ventaja: si la otra foto tiene distinta resolución pero un encuadre
# parecido, la ROI sigue cayendo en el mismo lugar relativo.
#   x0, x1 -> borde izquierdo y derecho (fracción del ancho) --> Ojo! No son píxeles
#   y0, y1 -> borde superior e inferior (fracción del alto)
# El origen (0,0) es la esquina SUPERIOR izquierda (convención de imágenes).
# Si ponés "roi: null", se usa la imagen completa.
# Ponemos el roi en fracciones pq si estuviera en píxeles con una imagen con otro tamaño, no sirve.
# roi para frame_Sofi_2
roi:
  x0: 0.25
  x1: 0.72
  y0: 0.25
  y1: 0.38


# -----------------------------------------------------------------------------
# Parámetros del punto 1.1
# -----------------------------------------------------------------------------
modulo1:
  # Porcentajes de submuestreo pedidos por la guía (1.1.3)
  escalas_submuestreo: [0.50, 0.25, 0.05]
  # Profundidades de bits a las que se recuantiza (1.1.4)
  bits_cuantizacion: [4, 2]

# Carpeta donde se guardan las figuras generadas
salida:
  carpeta_resultados: results/modulo1

# -----------------------------------------------------------------------------
# Parámetros del punto 1.2 (transformaciones de intensidad, ruido y filtros)
# -----------------------------------------------------------------------------
modulo1_2:
  # 1.2.2 — Rango de interés [f1, f2] (pupila + iris)
  # Elegirlos mirando el histograma: la "joroba" de valores bajos es el iris y
  # la pupila. Si se ponen en null, se calculan solos con los percentiles de
  # abajo (p. ej. 1 y 25 = el 25 % más oscuro de la ROI, sin el 1 % extremo).
  f1: 0
  f2: 100
  percentil_bajo: 1
  percentil_alto: 25

  # 1.2.3 — CLAHE (reutilizados en 2.1)
  clahe_clip: 2.0       # límite de contraste (más alto = más realce y más ruido)
  clahe_grilla: 8       # la ROI se divide en una grilla de 8 x 8 bloques

  # 1.2.4 — Ruido
  semilla: 42           # semilla aleatoria: mismo ruido en cada ejecución
  ruido_gauss_sigma: 20         # desvío del ruido gaussiano (en niveles de gris)
  ruido_sp_densidad: 0.05       # fracción de píxeles con sal o pimienta (5 %)
  ruido_speckle_varianza: 0.04  # varianza del ruido multiplicativo (desvío 0.2)

  # 1.2.4 — Filtros (tamaño de ventana, siempre IMPAR)
  kernel: 5
  gauss_sigma: 1.0      # desvío de la campana del filtro gaussiano (en píxeles)

# -----------------------------------------------------------------------------
# Parámetros del punto 1.3 - Bordes y frecuencia
# -----------------------------------------------------------------------------
modulo1_3:
  kernel: 5         # Tamaño de las ventanas
  sigma: 1.0        # Desvío de la campana del filtro gaussiano (en píxeles)
  corte: 0.10       # Umbral de corte de la FFT (fracción de la frecuencia máxima)
  texto_b: "PSIB"

# -----------------------------------------------------------------------------
# Parámetros del punto 2.1 (segmentación)
# -----------------------------------------------------------------------------
modulo2:
  snake:
    factor_radio_inicial: 1.15  # radio inicial = factor * radio estimado
    suavizado_k: 15             # tamaño de ventana del gaussiano previo
    suavizado_sigma: 3          # sigma del gaussiano previo
    alpha: 0.015                # tensión de la curva
    beta: 10                    # rigidez de la curva
    gamma: 0.01                 # paso del tiempo de la snake

  watershed:
    factor_interior: 0.5
    factor_anillo_interior: 1.3
    factor_anillo_exterior: 1.8

  kmeans:
    factor_ventana: 1


  morfologia:
    kernel: 3
    iteraciones: 1
    kernel_forma: ellipse

    # Operaciones a comparar
    comparar:
      - erosion
      - dilatacion
      - apertura
      - cierre
      - apertura_cierre
      - cierre_apertura

    # Operación elegida para el procesamiento final.
    # Dejar null mientras se evalúan los resultados.
    operacion_final: null

# -----------------------------------------------------------------------------
# Parámetros del Módulo 3 (descriptores, textura y dinámica temporal)
# -----------------------------------------------------------------------------
# El Módulo 3 trabaja SIEMPRE sobre el video de `entrada.video_path` (la
# misma ROI de arriba) y usa la segmentación del Módulo 2 (Watershed).
modulo3:
  # Operación morfológica final sobre la máscara de Watershed. Se toma la
  # mejor combinación del barrido de 2.2 (erosión k=3, 2 iteraciones: Dice
  # 0,849 contra la anotación manual). null en `operacion` = sin morfología.
  morfologia:
    operacion: erosion
    kernel: 3
    iteraciones: 2
    kernel_forma: ellipse

  # --- 3.1 Descriptores en un frame -----------------------------------------
  # Instante (s) del frame del video sobre el que se calculan forma y textura.
  # Conviene un frame con luz (iris bien iluminado, sin el reflejo de la
  # ventana sobre la pupila).
  tiempo_frame_s: 5.0
  # Niveles de gris a los que se cuantiza la ROI para entropía y GLCM.
  # El primero es el principal; el resto se usa para comparar.
  niveles_gris: [32, 64]
  glcm:
    distancias: [1, 2]               # en píxeles
    angulos_grados: [0, 45, 90, 135] # se promedian -> textura sin dirección
  region_iris:
    factor_iris: 0.85      # disco de 0,85·r_iris (sin el limbo)
    margen_pupila_px: 2    # se saca la pupila dilatada 2 px (borde mezclado)
    fila_min_rel: -0.6     # sin las filas por encima de cy − 0,6·r_iris (párpado)
    k_reflejo: 3.0         # reflejo = gris > mediana + 3·MAD del iris

  # --- 3.2 Video y curva temporal --------------------------------------------
  video:
    paso_frames: 1         # 1 = todos los frames
    paso_iris: 10          # cada cuántos frames se mide el radio del iris (escala)

  # Estímulo luminoso. null = detección automática a partir del salto de
  # brillo medio del frame (la luz ilumina toda la cara). Se pueden forzar
  # a mano con una lista de tiempos en segundos, p. ej. [3.84].
  estimulo:
    t_encendido_s: null
    t_apagado_s: null
    umbral_salto_min: 6.0  # salto mínimo de brillo entre frames (niveles de gris)
    k_mad: 10              # umbral = max(umbral_salto_min, k_mad · MAD del salto)
    separacion_min_s: 1.0  # dos saltos más cercanos que esto son el mismo evento

  # Detección y tratamiento de artefactos (parpadeos, movimientos, fallas)
  artefactos:
    circularidad_min: 0.55       # forma muy irregular -> la máscara se escapó
    excentricidad_max: 0.90      # forma muy alargada -> párpado/pestañas
    salto_centroide_max_px: 8    # movimiento brusco del ojo entre frames
    hampel_ventana_s: 1.0        # filtro de Hampel: ventana de la mediana móvil
    hampel_k: 3.0                # outlier si |D − mediana| > k · 1,4826 · MAD
    hueco_max_s: 0.35            # huecos más cortos se interpolan; más largos quedan NaN

  # Suavizado de la curva antes de derivar (velocidades)
  suavizado:
    mediana_frames: 5            # mediana móvil (impares): saca picos aislados
    sigma_s: 0.10                # gaussiano (desvío en segundos)

  # Parámetros fisiológicos
  parametros:
    ventana_basal_s: 1.0         # basal = mediana del 1 s previo al estímulo
    ventana_respuesta_s: 2.0     # se busca el extremo en los 2 s siguientes
    fraccion_inicio: 0.2         # inicio = cuando |v| supera 20 % de su pico
    k_ruido: 3.0                 # respuesta válida si su cambio > 3 · ruido basal

  # Escala píxel -> mm. "iris": usa el diámetro del iris medido en el video y
  # un diámetro real típico (~11,7 mm, adulto). "manual": usa mm_por_px.
  # null: solo píxeles.
  escala:
    modo: iris
    diametro_iris_mm: 11.7
    mm_por_px: null
    # Verificación opcional con una regla milimetrada visible en el video
    # (null si no hay). Coordenadas en píxeles del FRAME completo: una fila
    # que cruce las rayitas de los milímetros y el tramo [x0, x1] de la regla.
    regla:
      tiempo_s: 0.0
      fila_px: 552
      x0_px: 30
      x1_px: 330

  # Validación contra la anotación manual del Módulo 2
  carpeta_anotaciones: results/modulo2/anotaciones_manuales

  # Otros registros (videos) para la variabilidad entre trials. Cada uno con
  # su video y su ROI (fracciones). Vacío = solo el video de `entrada`.
  # Ejemplo:
  #   - video_path: data/videos/Video_Delca_1.mp4
  #     roi: {x0: 0.46, x1: 0.74, y0: 0.33, y1: 0.47}
  registros_extra: []

# -----------------------------------------------------------------------------
# Parámetros del Módulo 4 (compresión)
# -----------------------------------------------------------------------------
modulo4:
  # Se comprime SIEMPRE el frame original (el de `entrada`) y, además, cada
  # imagen segmentada del módulo 2 (rutas relativas a la raíz del repo).
  # Se leen tal cual están guardadas, en escala de grises.
  imagenes_segmentadas:
    - results/modulo2/2_1_6_watershed.png   # --> se guarda la máscara en el módulo 2
    - results/modulo2/2_1_4_otsu_mascara.png
    - results/modulo2/2_1_5_Snake_mascara.png
  # "rgb" (3 canales, como el frame original) o "gris" (1 canal)
  espacio: rgb

  # RLE: bits con los que se guarda la longitud de cada racha.
  # Con 8 bits la racha máxima es 255; las más largas se parten.
  rle_bits_longitud: 8

  # Huffman: decodificar y comprobar que la imagen vuelve idéntica (tarda
  # algunos segundos con el frame completo). false = solo calcular tamaños.
  verificar_huffman: true

  # JPEG: factores de calidad pedidos por la consigna
  calidades_jpeg: [90, 50, 10, 5]
  # Barrido más fino, para las curvas PSNR/SSIM vs ratio y el índice de bloques
  calidades_barrido: [100, 95, 90, 80, 70, 60, 50, 40, 30, 20, 15, 10, 8, 5, 3, 1]

  # Tamaño del bloque de la DCT de JPEG (para el índice de bloques)
  bloque_jpeg: 8

  # Zonas para comparar artefactos (en función del radio del iris estimado)
  zonas:
    ancho_borde_px: 2              # franja de ± px alrededor del borde pupilar
    factor_iris: 0.85              # el iris llega hasta 0.85 · r_iris (sin el limbo)
    esclerotica_rango: [1.3, 1.8]  # corona de la esclerótica (en radios del iris)
    # Filas de la esclerótica, relativas al centro del iris (en radios del iris;
    # y crece hacia abajo). Solo a los costados del iris, sin párpados/pestañas.
    esclerotica_filas: [-0.3, 0.6]
    ventana_textura: 7             # ventana del desvío local (textura de cada zona)

  # ¿La compresión cambia el diámetro pupilar?
  diametro:
    calidades: [90, 50, 10, 5]
    # Recorrer el video de `entrada.video_path` (si existe) y medir D(t)
    # en el original y con cada Q. paso_frames = 1 de cada N frames.
    usar_video: true
    paso_frames: 3