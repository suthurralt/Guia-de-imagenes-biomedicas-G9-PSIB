# =============================================================================
# config.yaml — ÚNICO archivo que hay que tocar para procesar otra imagen/video
# =============================================================================
# Todo lo que depende de la
# grabación concreta (rutas, ROI, instante del frame) lo ponemos acá, y el código
# solo lee estos valores.
#
# YAML es un formato de texto "clave: valor". La indentación (con espacios,
# nunca tabs) define qué está adentro de qué. "null" significa "vacío/ninguno".
# =============================================================================

entrada:
  # --- Opción 1: partir de una imagen ya extraída (lo que usamos ahora) ------
  # Ruta RELATIVA a la raíz del repo. Si es null, se usa el video.
  imagen_path: data/frames/frame_1_1.png

  # --- Opción 2: partir del video y extraer un frame automáticamente ---------
  # Solo se usa si imagen_path es null.
  video_path: data/videos/registro_A1.mp4
  # Instante (en segundos) del frame representativo dentro del video.
  frame_tiempo_s: 5.0

# -----------------------------------------------------------------------------
# Región de Interés (ROI) del ojo
# -----------------------------------------------------------------------------
# Se expresa en FRACCIONES del ancho y alto (valores entre 0 y 1), NO en
# píxeles. Ventaja: si la otra foto tiene distinta resolución pero un encuadre
# parecido, la ROI sigue cayendo en el mismo lugar relativo.
#   x0, x1 -> borde izquierdo y derecho (fracción del ancho) --> Ojo! No son píxeles
#   y0, y1 -> borde superior e inferior (fracción del alto)
# El origen (0,0) es la esquina SUPERIOR izquierda (convención de imágenes).
# Si ponés "roi: null", se usa la imagen completa.
# Ponemos el roi en fracciones pq si estuviera en píxeles con una imagen con otro tamaño, no sirve.
roi:
  x0: 0.36
  x1: 0.78
  y0: 0.29
  y1: 0.48

# -----------------------------------------------------------------------------
# Parámetros del punto 1.1
# -----------------------------------------------------------------------------
modulo1:
  # Porcentajes de submuestreo pedidos por la guía (1.1.3)
  escalas_submuestreo: [0.50, 0.25, 0.05]
  # Profundidades de bits a las que se recuantiza (1.1.4)
  bits_cuantizacion: [4, 2]

# Carpeta donde se guardan las figuras generadas
salida:
  carpeta_resultados: results/modulo1

# -----------------------------------------------------------------------------
# Parámetros del punto 1.2 (transformaciones de intensidad, ruido y filtros)
# -----------------------------------------------------------------------------
modulo1_2:
  # 1.2.2 — Rango de interés [f1, f2] (pupila + iris)
  # Elegirlos mirando el histograma: la "joroba" de valores bajos es el iris y
  # la pupila. Si se ponen en null, se calculan solos con los percentiles de
  # abajo (p. ej. 1 y 25 = el 25 % más oscuro de la ROI, sin el 1 % extremo).
  f1: 0
  f2: 100
  percentil_bajo: 1
  percentil_alto: 25

  # 1.2.3 — CLAHE (reutilizados en 2.1)
  clahe_clip: 2.0       # límite de contraste (más alto = más realce y más ruido)
  clahe_grilla: 8       # la ROI se divide en una grilla de 8 x 8 bloques

  # 1.2.4 — Ruido
  semilla: 42           # semilla aleatoria: mismo ruido en cada ejecución
  ruido_gauss_sigma: 20         # desvío del ruido gaussiano (en niveles de gris)
  ruido_sp_densidad: 0.05       # fracción de píxeles con sal o pimienta (5 %)
  ruido_speckle_varianza: 0.04  # varianza del ruido multiplicativo (desvío 0.2)

  # 1.2.4 — Filtros (tamaño de ventana, siempre IMPAR)
  kernel: 5
  gauss_sigma: 1.0      # desvío de la campana del filtro gaussiano (en píxeles)

# -----------------------------------------------------------------------------
# Parámetros del punto 1.3 - Bordes y frecuencia
# -----------------------------------------------------------------------------
modulo1_3:
  kernel: 5         # Tamaño de las ventanas
  sigma: 1.0        # Desvío de la campana del filtro gaussiano (en píxeles)
  corte: 0.10       # Umbral de corte de la FFT (fracción de la frecuencia máxima)
  texto_b: "PSIB"




# -----------------------------------------------------------------------------
# Parámetros del punto 2.1 (segmentación)
# -----------------------------------------------------------------------------
modulo2:
  snake:
    factor_radio_inicial: 1  # radio inicial = factor * radio estimado
    suavizado_k: 15             # tamaño de ventana del gaussiano previo
    suavizado_sigma: 3          # sigma del gaussiano previo
    alpha: 0.015                # tensión de la curva
    beta: 10                    # rigidez de la curva
    gamma: 0.01                 # paso del tiempo de la snake

  watershed:
    factor_interior: 0.5
    factor_anillo_interior: 1.3
    factor_anillo_exterior: 1.8

  kmeans:
    k_clusters: 4
    factor_ventana: 1
